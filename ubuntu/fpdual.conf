<VirtualHost *:80>
    ServerName empresas.example.invalid
    DocumentRoot /var/www/fpdual
    <Directory /var/www/fpdual>
        AllowOverride None
        Options -Indexes
        Require all granted
        DirectoryIndex index.php
        <FilesMatch "^(config.*\.php|seed\.json|lib\.php|auth\.php|inbox\.php|prospecting\.php|campaigns\.php|imports\.php|panels\.php|portal\.php|teacher\.php)$">
            Require all denied
        </FilesMatch>
    </Directory>
    php_value upload_max_filesize 12M
    php_value post_max_size 16M
    php_value memory_limit 256M
    # Sin query strings en logs: los enlaces de recuperación contienen tokens.
    LogFormat "%h %t \"%m %U %H\" %>s %b" fpdual_safe
    CustomLog ${APACHE_LOG_DIR}/fpdual-access.log fpdual_safe
    ErrorLog ${APACHE_LOG_DIR}/fpdual-error.log
</VirtualHost>
